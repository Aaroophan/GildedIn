name: Verify GildedIn
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - name: Install Node
        run: |
          node --version
          npm --version
      - name: Locked install
        run: npm ci --ignore-scripts
      - name: Secret checks
        run: npm run check:secrets
      - name: License checks
        run: npm run check:licenses
      - name: Supply chain checks
        run: npm run check:supply-chain
      - name: Architecture checks
        run: npm run check:requirements && npm run check:boundaries && npm run check:ci
      - name: Tests
        run: npm test
      - name: TypeScript
        run: npm run typecheck
      - name: Build
        run: npm run build
